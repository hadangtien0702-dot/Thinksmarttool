<!DOCTYPE html>
<!-- TRANG TỰ CHẨN ĐOÁN cho màn Tính phí. Mở: localhost:8000/kiem-nhanh.html
     Không cần đăng nhập, không cần gõ lệnh — mở ra là thấy bản đang chạy là gì. -->
<html lang="vi"><head>
<meta charset="utf-8"><title>Kiểm nhanh — Tính phí</title>
<style>
  body{font:15px/1.7 system-ui,Segoe UI,sans-serif;padding:28px;max-width:760px;margin:0 auto;color:#1b1b22}
  h1{font-size:20px;margin:0 0 4px} p.sub{color:#666;margin:0 0 22px}
  .d{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:9px;margin-bottom:8px;background:#f6f6fa}
  .ok{background:#e8f7ee} .xau{background:#fdeaea}
  .ic{font-weight:800;flex-shrink:0}
  .ok .ic{color:#137a3c} .xau .ic{color:#c0271c}
  b{font-variant-numeric:tabular-nums}
  code{background:#ececf3;padding:1px 6px;border-radius:4px;font-size:13px}
  .kl{margin-top:20px;padding:14px 16px;border-radius:10px;font-weight:600}
</style></head><body>
<h1>Kiểm nhanh — công cụ Tính phí</h1>
<p class="sub">Trang này đọc thẳng dữ liệu từ máy chủ. Nếu mọi dòng đều xanh mà tool vẫn sai,
thì trình duyệt đang giữ bản cũ — bấm <b>Ctrl + Shift + R</b>.</p>
<div id="kq">Đang kiểm…</div>
<script>
const el = document.getElementById('kq');
const dong = [];
const them = (ok, ten, chiTiet) => dong.push(
  `<div class="d ${ok ? 'ok' : 'xau'}"><span class="ic">${ok ? '✓' : '✕'}</span>
   <span><b>${ten}</b>${chiTiet ? '<br><span style="color:#555">' + chiTiet + '</span>' : ''}</span></div>`);

(async function () {
  let tot = 0, tong = 0;
  const thu = async (ten, fn) => {
    tong++;
    try { const r = await fn(); them(r.ok, ten, r.mo); if (r.ok) tot++; }
    catch (e) { them(false, ten, 'Lỗi: ' + e.message); }
  };

  await thu('Bảng phí IUL', async () => {
    const j = await (await fetch('/data/bang-phi-iul.json')).json();
    const n = Object.keys(j.bang).length;
    return { ok: n === 7, mo: n + ' nhóm (đúng phải 7)' };
  });

  await thu('4 ô bảng phí đã sửa theo PDF của hãng', async () => {
    const j = await (await fetch('/data/bang-phi-iul.json')).json();
    const ca = [['20|FEMALE|NTBC',33,700000,557.2],['20|FEMALE|NTBC',41,425000,496.4],
                ['20|MALE|NTBC',36,700000,753.2],['20|MALE|NTBC',59,225000,830.25]];
    const sai = ca.filter(([k,t,m,v]) => j.bang[k].tuoi[t][m] !== v);
    return { ok: !sai.length, mo: sai.length ? sai.length + ' ô CHƯA sửa' : 'cả 4 ô đúng số mới' };
  });

  await thu('Bảng tra file PDF + CSV', async () => {
    const j = await (await fetch('/data/pdf-file-iul.json')).json();
    const n = Object.keys(j.file).length;
    return { ok: n > 5000, mo: n.toLocaleString('vi-VN') + ' tổ hợp có link tải thẳng' };
  });

  await thu('Ví dụ: Nam · TBC · 35 tuổi · $175.000 (IUL 20 năm)', async () => {
    const j = await (await fetch('/data/pdf-file-iul.json')).json();
    const c = j.file['20|MALE|TBC|35|175000'];
    if (!c) return { ok: false, mo: 'KHÔNG có trong bảng tra' };
    const [a, b] = c.split(',');
    return { ok: !!(a && b), mo:
      `PDF: <a href="https://drive.google.com/uc?export=download&id=${a}" target="_blank">bấm tải thử</a>
       &nbsp;·&nbsp; CSV: <a href="https://drive.google.com/uc?export=download&id=${b}" target="_blank">bấm tải thử</a>` };
  });

  await thu('Phiên bản JS mà trang /tool đang gọi', async () => {
    const t = await (await fetch('/tool', { cache: 'no-store' })).text();
    const v = (t.match(/tinhphi\.js\?v=(\d+)/) || [])[1];
    return { ok: +v >= 16, mo: 'tinhphi.js?v=' + v + (+v >= 16 ? '' : ' — MÁY CHỦ đang chạy bản cũ') };
  });

  el.innerHTML = dong.join('') +
    `<div class="kl" style="background:${tot === tong ? '#e8f7ee' : '#fdeaea'}">
       ${tot}/${tong} mục đạt.
       ${tot === tong
         ? 'Máy chủ đang chạy đúng bản mới. Nếu trong tool vẫn thấy sai, hãy mở <code>/tool</code> rồi bấm <b>Ctrl + Shift + R</b>.'
         : 'Có mục chưa đạt — gửi ảnh màn hình này cho Claude.'}
     </div>`;
})();
</script>
</body></html>
